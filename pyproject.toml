[project]
name = "astrotwo"
version = "0.1.0b2"
description = "AstroTwo: successore di Aladin per gli astrofisici"
readme = "CLAUDE.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15.0",
    "astropy>=8.0.1",
    "astropy-healpix>=2.0.1",
    "astroquery>=0.4.11",
    "defusedxml>=0.7.1",
    "keyring>=25.7.0",
    "matplotlib>=3.11.2",
    "mocpy>=0.20.0",
    "numpy>=2.5.3",
    "openai>=3.31.0",
    "pds4-tools>=1.4",
    "pillow>=12.3.0",
    "pyside6-essentials>=6.12.0",
    "pyvo>=1.9.1",
    "reproject>=0.21.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "spherical-geometry>=1.4.0",
    "spiceypy>=8.3.0",
]

[project.scripts]
astrotwo = "astrotwo.ui.main_window:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.2",
]
# Costruzione di AstroTwo.app (60-distribuzione-dmg.md): versioni fissate, almeno due settimane al 2026-10-25 (§3.11 V-c).
build = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.8",
    "setuptools==84.0.0",
]

[tool.uv]
# Anche il gruppo ``build`` nel .venv: THIRD_PARTY_LICENSES legge PyInstaller installato (60 §3.7) e i due ambienti
# (.venv e build/env) hanno gli stessi pacchetti.
default-groups = ["dev", "build"]

[tool.astrotwo.bundle]
# Numero di build di AstroTwo.app (CFBundleVersion, 60 §3.2): intero, +1 a ogni app consegnata.
build = 2

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrotwo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not keychain and not perf and not gl'"
# Un test fermo diventa un fallimento con il suo nome (pytest-timeout): 120 s a test, 300 s per quelli di rete
# (``tests/conftest.py``). Metodo ``thread``: scrive le pile di tutti i thread e termina il processo, perché un
# blocco dentro Qt o in un thread di lavoro non risponderebbe a un segnale.
timeout = 120
timeout_method = "thread"
markers = [
    "network: test che richiedono la rete (esclusi di default, 02-convenzioni.md §8 punto 3)",
    "keychain: test sul Portachiavi reale di macOS (esclusi di default, eseguiti a mano, 31 §12)",
    "perf: misure di prestazioni sul Mac di riferimento (escluse di default, riportate, D41-4)",
    "gl: test del disegno OpenGL (esclusi di default, bloccanti quando si eseguono, D41-4)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Solo errori veri (variabili e import inutilizzati, nomi ridefiniti, f-string vuote); lo stile non si controlla.
select = ["E", "F"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
# I fixture di pytest importati da altri file di test sembrano ridefiniti (F811): è il modo in cui pytest li trova.
"tests/**" = ["F811"]
