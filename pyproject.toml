[project]
name = "astrotwo"
version = "0.1.0"
description = "AstroTwo: successore di Aladin per gli astrofisici"
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy>=8.0.1",
    "astropy-healpix>=2.0.1",
    "astroquery>=0.4.11",
    "defusedxml>=0.7.1",
    "matplotlib>=3.11.2",
    "mocpy>=0.20.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyvo>=1.9.1",
    "reproject>=0.21.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "spherical-geometry>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrotwo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: test che richiedono la rete (esclusi di default, 02-convenzioni.md §8 punto 3)",
]
