<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E9CFF"/>
      <stop offset="100%" stop-color="#7B6CFF"/>
    </linearGradient>
  </defs>

  <!-- Sfondo squircle, stile icona macOS -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>

  <!-- Cartella stilizzata -->
  <path d="M 232 380
           L 232 700
           Q 232 730 262 730
           L 762 730
           Q 792 730 792 700
           L 792 460
           Q 792 430 762 430
           L 520 430
           L 480 380
           Q 470 368 454 368
           L 262 368
           Q 232 368 232 398
           Z"
        fill="#FFFFFF" opacity="0.95"/>

  <!-- Scintilla IA sopra la cartella -->
  <g transform="translate(700,300)">
    <path d="M0 -90 
             C 14 -34 26 -22 82 -8
             C 26 6 14 18 0 74
             C -14 18 -26 6 -82 -8
             C -26 -22 -14 -34 0 -90 Z"
          fill="url(#accent)"/>
    <circle cx="0" cy="0" r="14" fill="url(#accent)" opacity="0.35"/>
  </g>

  <!-- Piccola scintilla secondaria -->
  <g transform="translate(628,220) scale(0.45)">
    <path d="M0 -90 
             C 14 -34 26 -22 82 -8
             C 26 6 14 18 0 74
             C -14 18 -26 6 -82 -8
